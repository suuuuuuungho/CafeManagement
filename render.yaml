services:
  - type: web
    name: cafe-management-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Pin to a version with prebuilt wheels for pydantic-core (Rust-based) —
      # Render's default Python is newer than published wheels for our pin.
      - key: PYTHON_VERSION
        value: 3.12.7
      # Neon connection string, scheme swapped to postgresql+asyncpg://
      # Use the DIRECT host (no "-pooler" in it) — see backend/.env.example
      # for why the pooled one can wedge itself after a schema change.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      # Origin only, no path — e.g. https://<user>.github.io (NOT .../<repo>/).
      # Browsers send Origin without a path, so CORSMiddleware's exact-match
      # list won't match if you include one. Comma-separate for more than one.
      - key: CORS_ORIGINS
        sync: false
      - key: DEPOSIT_MATCH_WINDOW_MINUTES
        value: "30"
